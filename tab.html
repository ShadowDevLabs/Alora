<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alora Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="assets/css/tab.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/x-icon" href="/assets/imgs/icons/alora.png" />
</head>

<body>
    <div class="browser-container">
        <nav class="nav-bar">
            <div class="nav-controls">
                <button class="nav-btn" id="backBtn" title="Go back">
                    <!-- Lucide: arrow-left -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-left-icon lucide-arrow-left">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                </button>
                <button class="nav-btn" id="forwardBtn" title="Go forward">
                    <!-- Lucide: arrow-right -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-right-icon lucide-arrow-right">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </button>
                <button class="nav-btn" id="refreshBtn" title="Refresh">
                    <!-- Lucide: rotate-cw -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-rotate-cw-icon lucide-rotate-cw">
                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                    </svg>
                </button>
            </div>

            <div class="address-bar">
                <span class="lock-icon">
                    <!-- Lucide: lock -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                </span>
                <input type="text" class="address-input" placeholder="Search or enter web address"
                    value="https://alora.app" id="addressInput" />
            </div>

            <div class="profile-section">
                <div class="profile-pic" title="Profile">NC</div>
                <button class="menu-btn" title="More options">
                    <!-- Lucide: more-vertical -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-more-vertical"
                        viewBox="0 0 24 24">
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                </button>
            </div>
        </nav>

        <iframe src="new.html" class="content-frame" id="contentFrame"></iframe>
    </div>
</body>

</html>
